<!DOCTYPE html>
<!--version: 8.3 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Woordklok Control</title>
    <style>
        /* ===== CSS VARIABLES - EASY THEME TWEAKING ===== */
        :root {
            /* Main colors - Change these to tweak the theme */
            --primary-color: #4361ee;      /* Main brand color */
            --secondary-color: #7209b7;     /* Accent color */
            --success-color: #06d6a0;       /* Success/positive actions */
            --warning-color: #ff9e00;        /* Warning/caution */
            --danger-color: #ef476f;         /* Danger/delete actions */
            
            /* Background gradient - Change for different look */
            --bg-gradient-start: #4158D0;
            --bg-gradient-end: #C850C0;
            --bg-gradient-angle: 135deg;
            
            /* Card styling */
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), 0 6px 12px rgba(0, 0, 0, 0.1);
            --card-border-radius: 24px;
            
            /* Section styling */
            --section-bg: rgba(255, 255, 255, 0.5);
            --section-border: 2px solid rgba(255, 255, 255, 0.8);
            --section-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            
            /* Text colors */
            --text-primary: #2b2d42;
            --text-title: #7209b7;
            --text-secondary: #4a4e69;
            --text-light: #8d99ae;
            --text-white: #ffffff;
            
            /* Control styling */
            --slider-track: linear-gradient(90deg, #ff006e, #fb5607, #ffbe0b);
            --select-border: 2px solid var(--primary-color);
            
            /* ===== SPACING - ADJUST THESE VALUES ===== */
            /* Increase these for more vertical breathing room */
            --spacing-xs: 6px;     /* WAS: 8px - INCREASED for more space */
            --spacing-sm: 8px;     /* WAS: 12px - INCREASED for more space */
            --spacing-md: 12px;    /* WAS: 16px - INCREASED for more space */
            --spacing-lg: 16px;    /* WAS: 20px - INCREASED for more space */
            --spacing-xl: 24px;    /* WAS: 28px - INCREASED for more space */
            
            /* Animations */
            --transition-speed: 0.3s;
        }

        /* ===== BASE STYLES ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(var(--bg-gradient-angle), var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: var(--spacing-md);
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: var(--spacing-lg);
            border-radius: var(--card-border-radius);
            box-shadow: var(--card-shadow);
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin: auto;
            transition: transform var(--transition-speed);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* ===== TYPOGRAPHY - ADJUST FONT SIZES HERE ===== */
        h3 {
            color: var(--text-primary);
            margin: 0 0 var(--spacing-xs) 0;
            font-size: 1.6rem;     /* WAS: 1.8rem - INCREASED for larger title */
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        h3:last-of-type {
            color: var(--secondary-color);
            font-size: 1.4rem;     /* WAS: 1.1rem - INCREASED for subtitle */
            margin-bottom: var(--spacing-sm);
        }

        h6 {
            color: var(--text-light);
            margin: var(--spacing-xs) 0 0 0;
            font-size: 0.8rem;      /* WAS: 0.75rem - INCREASED slightly */
            font-weight: 400;
        }

        /* ===== SECTION DIVIDERS ===== */
        .section {
            background: var(--section-bg);
            border-radius: 16px;
            padding: 12px 14px;     /* WAS: 14px 16px */
            margin: 12px 0;          /* WAS: 16px  space between sections */
            border: var(--section-border);
            box-shadow: var(--section-shadow);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all var(--transition-speed);
        }

        .section:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.01);
        }

        .section-title {
            color: var(--text-title);
            font-size: 1.0rem;       /* WAS: 0.85rem - INCREASED for section headers */
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: var(--spacing-sm);  /* WAS: xs - INCREASED spacing below title */
            text-align: left;
            padding-left: var(--spacing-xs);
        }

        /* Hide the old line dividers */
        .line {
            display: none;
        }

        /* ===== COLOR PICKER SECTION ===== */
        .color-picker-container {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);  /* WAS: sm - INCREASED gap between button and inputs */
            width: 100%;
        }

        #swatchBtn {
            width: 44px;             /* WAS: 48px -  button size */
            height: 44px;            /* WAS: 48px -  button size */
            border-radius: 12px;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            flex-shrink: 0;
        }

        #swatchBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .rgb-inputs {
            display: flex;
            gap: var(--spacing-xs);
            justify-content: center;
            flex: 1;
        }

        .rgb-inputs label {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;       /* WAS: 0.7rem - INCREASED for readability */
            font-weight: 600;
            color: var(--text-secondary);
            flex: 1;
        }

        .rgb-inputs input {
            width: 100%;
            padding: 6px;             /* WAS: var(--spacing-xs) - INCREASED input padding */
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.8rem;        /* WAS: 1.0rem - INCREASED input text */
            font-weight: 600;
            transition: all var(--transition-speed);
            margin-top: 4px;           /* WAS: 2px - INCREASED spacing */
        }

        .rgb-inputs input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        /* R,G,B input specific colors */
        .rgb-inputs label:first-child input { color: var(--danger-color); }
        .rgb-inputs label:nth-child(2) input { color: var(--success-color); }
        .rgb-inputs label:last-child input { color: var(--primary-color); }

        /* ===== SETTINGS SECTION ===== */
        .settings {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);    /* WAS: xs - INCREASED gap between setting rows */
            width: 100%;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            width: 100%;
        }

        .setting-row label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;         /* WAS: 0.85rem - INCREASED label size */
            min-width: 100px;
            text-align: left;
        }

        .setting-row select {
            flex: 1;
            padding: 10px 14px;        /* WAS: var(--spacing-sm) var(--spacing-md) - INCREASED select padding */
            border-radius: 10px;
            border: var(--select-border);
            background: white;
            font-size: 0.85rem;         /* WAS: 1.1rem - INCREASED select text */
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-speed);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.8rem center;
            background-size: 1em;
        }

        .setting-row select:hover {
            border-color: var(--secondary-color);
            box-shadow: 0 2px 8px rgba(114, 9, 183, 0.2);
        }

        /* ===== SLIDER SECTION ===== */
        .control-group {
            width: 100%;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;         /* WAS: 0.85rem - INCREASED label size */
            text-align: left;
            margin-bottom: 6px;         /* WAS: 2px - INCREASED space below label */
        }

        #bg-value {
            color: var(--secondary-color);
            background: rgba(114, 9, 183, 0.1);
            padding: 4px 8px;           /* WAS: 2px 6px - INCREASED padding */
            border-radius: 20px;
            margin-left: var(--spacing-xs);
            font-size: 0.85rem;           /* WAS: 0.8rem - INCREASED slightly */
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;                /* WAS: 6px - INCREASED slider height */
            border-radius: 10px;
            background: var(--slider-track);
            outline: none;
            margin: var(--spacing-sm) 0; /* WAS: xs - INCREASED margin around slider */
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;                /* WAS: 20px - INCREASED thumb size */
            height: 24px;               /* WAS: 20px - INCREASED thumb size */
            border-radius: 50%;
            background: white;
            border: 3px solid var(--primary-color);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: transform var(--transition-speed);
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* ===== BRIGHTNESS DISPLAY ===== */
        .brightness-display {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 16px;
            padding: var(--spacing-md);  /* WAS: sm - INCREASED padding */
            margin: var(--spacing-xs) 0;
        }

        .brightness-display h6 {
            color: var(--text-white);
            margin: 0;
            font-size: 0.9rem;           /* WAS: 0.9rem - INCREASED text size */
            font-weight: 500;
        }

        #brightnessValue {
            font-size: 0.9rem;            /* WAS: 1.0rem - INCREASED slightly */
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;            /* WAS: 2px 8px - INCREASED padding */
            border-radius: 30px;
            display: inline-block;
            margin-left: var(--spacing-xs);
        }

        /* ===== PICKER ANCHOR ===== */
        #pickerAnchor {
            display: none;
            width: 100%;
            margin-top: var(--spacing-md); /* WAS: sm - INCREASED space above picker */
        }
        
        #pickerAnchor.open {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #pickerAnchor .picker_wrapper {
            position: relative !important;
            box-shadow: none !important;
            width: 100% !important;
            background: transparent !important;
        }

        #pickerAnchor .picker_sl {
            width: 100% !important;
            height: 220px !important;      /* WAS: 200px - INCREASED picker height */
            border-radius: 16px !important;
        }

        #pickerAnchor .picker_hue {
            width: 100% !important;
            height: 28px !important;       /* WAS: 24px - INCREASED hue slider height */
            margin-top: var(--spacing-sm) !important;
            border-radius: 20px !important;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: var(--spacing-lg);  /* WAS: sm - INCREASED space above footer */
            color: var(--text-light);
            font-size: 0.8rem;              /* WAS: 0.7rem - INCREASED text size */
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Woordklok {{woordklok_name}}</h3>

        <!-- Color Picker Section -->
        <div class="section">
            <div class="section-title">Words Color</div>
            <div class="color-picker-container">
                <button id="swatchBtn" onclick="togglePicker()" title="Pick colour"></button>
                <div class="rgb-inputs">
                    <label>R <input type="number" id="rVal" min="0" max="255" value="{{ initial_color[0] }}"></label>
                    <label>G <input type="number" id="gVal" min="0" max="255" value="{{ initial_color[1] }}"></label>
                    <label>B <input type="number" id="bVal" min="0" max="255" value="{{ initial_color[2] }}"></label>
                </div>
            </div>
            <div id="pickerAnchor"></div>
        </div>

        <!-- Display Settings Section -->
        <div class="section">
            <div class="section-title">Display Settings</div>
            <div class="settings">
                <div class="setting-row">
                    <label for="clock_type">Clock Type</label>
                    <select id="clock_type" onchange="updateClockType()">
                        {% for effect in available_effects %}
                        <option value="{{ effect.id }}" {% if effect.id == initial_clock_type %}selected{% endif %}>
                           {{ effect.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="setting-row">
                    <label for="purist">Purist Mode</label>
                    <select id="purist" onchange="updateSettings()">
                        <option value="true" {% if initial_purist == True %}selected{% endif %}>On</option>
                        <option value="false" {% if initial_purist == False %}selected{% endif %}>Off</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label for="language">Language</label>
                    <select id="language" onchange="updateSettings()">
                        <option value="NL" {% if initial_language == "NL" %}selected{% endif %}>Nederlands</option>
                        <option value="EN" {% if initial_language == "EN" %}selected{% endif %}>English</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Background Brightness Section -->
        <div class="section">
            <div class="section-title">Background Dimming</div>
            <div class="control-group">
                <label>Brightness Level <span id="bg-value">--%</span></label>
                <input type="range" 
                       id="bg-brightness" 
                       min="0" 
                       max="1" 
                       step="0.01" 
                       value="1.0"
                       oninput="updateBackgroundBrightness(this.value)">
            </div>
        </div>

        <!-- Light Sensor Section -->
        {% if has_light_sensor %}
        <div class="section">
            <div class="section-title">Ambient Light</div>
            <div class="brightness-display">
                <h6>Current Brightness <span id="brightnessValue">0</span></h6>
            </div>
        </div>
        {% endif %}

        <!-- Footer -->
        <div class="footer">
            <h6>{{woordklok_location}} lat: {{woordklok_lat}} lon: {{woordklok_lon}}</h6>
            <h6>GraWoosh v{{woordklok_version}}</h6>
        </div>
    </div>

    <script src="/static/vanilla-picker.min.js"></script>
    <script>
        // ===== COLOR PICKER LOGIC =====
        const rVal = document.getElementById('rVal');
        const gVal = document.getElementById('gVal');
        const bVal = document.getElementById('bVal');

        const initialColor = {
            r: {{ initial_color[0] }},
            g: {{ initial_color[1] }},
            b: {{ initial_color[2] }}
        };

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
        }

        // Set initial swatch colour
        document.getElementById('swatchBtn').style.backgroundColor =
            `rgb(${initialColor.r},${initialColor.g},${initialColor.b})`;

        // Prevent feedback loop when picker updates inputs
        let updatingFromPicker = false;

        // Initialise vanilla-picker
        const picker = new Picker({
            parent: document.getElementById('pickerAnchor'),
            popup: false,
            alpha: false,
            editor: false,
            color: rgbToHex(initialColor.r, initialColor.g, initialColor.b),
            onChange: function(color) {
                const r = Math.round(color.rgba[0]);
                const g = Math.round(color.rgba[1]);
                const b = Math.round(color.rgba[2]);
                updatingFromPicker = true;
                rVal.value = r;
                gVal.value = g;
                bVal.value = b;
                updatingFromPicker = false;
                document.getElementById('swatchBtn').style.backgroundColor = `rgb(${r},${g},${b})`;
                setColor({ r, g, b });
            }
        });

        // Sync RGB number inputs back to picker
        function updateFromInputs() {
            if (updatingFromPicker) return;
            const r = Math.min(255, Math.max(0, parseInt(rVal.value) || 0));
            const g = Math.min(255, Math.max(0, parseInt(gVal.value) || 0));
            const b = Math.min(255, Math.max(0, parseInt(bVal.value) || 0));
            picker.setColor(rgbToHex(r, g, b), true);
            document.getElementById('swatchBtn').style.backgroundColor = `rgb(${r},${g},${b})`;
            setColor({ r, g, b });
        }

        rVal.addEventListener('change', updateFromInputs);
        gVal.addEventListener('change', updateFromInputs);
        bVal.addEventListener('change', updateFromInputs);

        // Toggle picker visibility
        function togglePicker() {
            const anchor = document.getElementById('pickerAnchor');
            anchor.classList.toggle('open');
        }

        // Set color via fetch
        function setColor(color) {
            const formData = new FormData();
            formData.append('red', color.r);
            formData.append('green', color.g);
            formData.append('blue', color.b);

            fetch('/set_color', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                console.log("Color updated successfully");
            })
            .catch(error => {
                console.error("Error updating color:", error);
                alert("Failed to update color");
            });
        }
        
        // ===== BACKGROUND BRIGHTNESS SLIDER =====
        function updateBackgroundBrightness(value) {
            // Update display with nice animation
            const display = document.getElementById('bg-value');
            display.textContent = Math.round(value * 100) + '%';
            display.style.transform = 'scale(1.2)';
            setTimeout(() => display.style.transform = 'scale(1)', 100);
            
            // Send to server
            fetch('/set_background_brightness', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({value: parseFloat(value)})
            })
            .catch(error => console.error('Error updating background brightness:', error));
        }
        
        // Load initial background brightness value
        fetch('/get_background_brightness')
            .then(response => response.json())
            .then(data => {
                const slider = document.getElementById('bg-brightness');
                const display = document.getElementById('bg-value');
                slider.value = data.value;
                display.textContent = Math.round(data.value * 100) + '%';
            })
            .catch(error => {
                console.error('Error loading background brightness:', error);
                document.getElementById('bg-value').textContent = '100%';
            });
        
        // ===== CLOCK TYPE UPDATE =====
        function updateClockType() {
            const select = document.getElementById('clock_type');
            fetch('/set_effect', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({effect_id: select.value})
            })
            .then(response => response.json())
            .then(data => { 
                if (data.status === 'success') {
                    console.log('Effect changed to', select.value);
                    // Visual feedback
                    select.style.borderColor = 'var(--success-color)';
                    setTimeout(() => select.style.borderColor = 'var(--primary-color)', 500);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // ===== SETTINGS UPDATE =====
        function updateSettings() {
            const settings = {
                language: document.getElementById("language").value,
                purist: document.getElementById("purist").value
            };
            fetch('/update_settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(settings)
            })
            .then(response => { 
                if (!response.ok) throw new Error('Network response was not ok');
                console.log('Settings updated:', settings);
            })
            .catch(error => console.error('Error:', error));
        }

        // ===== BRIGHTNESS POLLING =====
        {% if has_light_sensor %}
        function updateBrightness() {
            fetch('/show_brightness')
            .then(response => response.json())
            .then(data => {
                if (data.brightness) {
                    const display = document.getElementById('brightnessValue');
                    display.textContent = data.brightness;
                    // Flash effect on update
                    display.style.opacity = '0.8';
                    setTimeout(() => display.style.opacity = '1', 100);
                }
            })
            .catch(error => console.error("Error getting brightness:", error));
        }
        setInterval(updateBrightness, 1000);
        updateBrightness();
        {% endif %}

        // ===== ADD SMOOTH SCROLLING =====
        document.querySelectorAll('select').forEach(select => {
            select.addEventListener('focus', () => {
                select.style.transform = 'scale(1.02)';
            });
            select.addEventListener('blur', () => {
                select.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
