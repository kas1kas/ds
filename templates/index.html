<!DOCTYPE html>
<!__ version 5.53 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woordklok Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.1/spectrum.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 0px;
        }
        .container {
            background-color: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 300px;
        }
        .brightness-display {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        button {
            padding: 4px 4px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
            width: 50%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .settings {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }
        .settings select {
            padding: 8px;
            width: 50%;
            border-radius: 5px;
            border: 1px solid #ccc;
            align-items: center;
            justify-content: center;
        }
        .color-preview {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 1px solid #000;
            vertical-align: middle;
        }
        .color-picker-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .rgb-value {
            margin-left: 10px;
            font-size: 14px;
            font-family: monospace;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 10px;
            border: 1px solid #888;
            width: 60%;
            max-width: 500px;
            border-radius: 10px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        #brightness-slider {
            width: 100%;
            margin: 15px 0;
        }
        .calibration-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .calibration-points {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Woordklok {{woordklok_name}}</h3>
        <div class="brightness-display">
            <h5><span>Lux:Bright = </span>
            <span id="brightnessValue">0</span></h5>
        </div>

        <div class="color-picker-container">
            <input type="text" id="colorPicker">
            <div id="colorPreview" class="color-preview"></div>
            <span id="rgbValue" class="rgb-value">RGB({{ initial_color[0] }}, {{ initial_color[1] }}, {{ initial_color[2] }})</span>
        </div>
        <form id="colorForm">
            <button type="submit">Set Color</button>
        </form>
        <div class="settings">
            <label for="language"><b>Language:</b></label>
            <select id="language">
                <option value="NL" {% if initial_language == "NL" %}selected{% endif %}>NL</option>
                <option value="EN" {% if initial_language == "EN" %}selected{% endif %}>EN</option>
            </select>
            <label for="clock_type"><b>Display:</b></label>
            <select id="clock_type">
                <option value="regular" {% if initial_clock_type == "regular" %}selected{% endif %}>Regular</option>
                <option value="random" {% if initial_clock_type == "random" %}selected{% endif %}>Random</option>
                <option value="rainbow" {% if initial_clock_type == "rainbow" %}selected{% endif %}>Rainbow</option>
                <option value="dark" {% if initial_clock_type == "dark" %}selected{% endif %}>Dark</option>
                <option value="test" {% if initial_clock_type == "test" %}selected{% endif %}>Test</option>
            </select>
            <label for="purist"><b>Purist mode:</b></label>
            <select id="purist">
                <option value="true" {% if initial_purist == True %}selected{% endif %}>True</option>
                <option value="false" {% if initial_purist == False %}selected{% endif %}>False</option>
            </select>
            <button id="updateSettings">Change</button>
            <button id="enterCalibration">Calibration mode</button>
        </div>
        <h6>GraWoosh {{woordklok_version}}</h6>
    </div>

    <!-- Calibration Modal -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.1/spectrum.min.js"></script>
    <script>
        $(document).ready(function () {
            // Initialize color picker
            const initialColor = {
                r: {{ initial_color[0] }},
                g: {{ initial_color[1] }},
                b: {{ initial_color[2] }}
            };

            $("#colorPicker").spectrum({
                color: `rgb(${initialColor.r}, ${initialColor.g}, ${initialColor.b})`,
                preferredFormat: "rgb",
                showInput: true,
                showInitial: true,
                allowEmpty: false,
                change: function(color) {
                    const rgbColor = color.toRgb();
                    const previewColor = `rgb(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b})`;
                    $("#colorPreview").css("background-color", previewColor);
                    $("#rgbValue").text(`RGB(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b})`);
                }
            });

            $("#colorPreview").css("background-color", `rgb(${initialColor.r}, ${initialColor.g}, ${initialColor.b})`);
            
            // Form submission
            $("#colorForm").submit(function(e) {
                e.preventDefault();
                const color = $("#colorPicker").spectrum("get").toRgb();
                $.ajax({
                    url: "/set_color",
                    type: "POST",
                    data: {
                        red: color.r,
                        green: color.g,
                        blue: color.b
                    },
                    success: function() {
                        console.log("Color updated successfully");
                    },
                    error: function(xhr) {
                        console.error("Error updating color:", xhr.responseText);
                        alert("Failed to update color");
                    }
                });
            });

            // Settings update
            $("#updateSettings").click(function() {
                const settings = {
                    language: $("#language").val(),
                    clock_type: $("#clock_type").val(),
                    purist: $("#purist").val()
                };
                
                $.ajax({
                    url: "/set_language",
                    type: "POST",
                    data: { language: settings.language },
                    error: function(xhr) {
                        console.error("Error updating language:", xhr.responseText);
                    }
                });
                
                $.ajax({
                    url: "/set_clock_type",
                    type: "POST",
                    data: { clock_type: settings.clock_type },
                    error: function(xhr) {
                        console.error("Error updating clock type:", xhr.responseText);
                    }
                });
                
                $.ajax({
                    url: "/set_purist",
                    type: "POST",
                    data: { purist: settings.purist },
                    error: function(xhr) {
                        console.error("Error updating purist mode:", xhr.responseText);
                    }
                });
            });

            $("#enterCalibration").click(function() {
               $.ajax({
                   url: "/set_mode",
                   type: "POST",
                   contentType: "application/json",
                   data: JSON.stringify({ mode: "calibration" }),
                   success: function() {
                       window.location.href = "/calibration.html";
                   },
                   error: function(xhr) {
                       alert("Error entering calibration mode: " + xhr.responseText);
                   }
               });
           });

           // Brightness updates
            function updateBrightness() {
                $.get("/get_brightness", function(data) {
                    if (data.brightness) {
                        $("#brightnessValue").text(data.brightness);
                    }
                }).fail(function(xhr) {
                    console.error("Error getting brightness:", xhr.responseText);
                });
            }
            setInterval(updateBrightness, 3000);
            updateBrightness();
           
        });
    </script>
</body>
</html>
